# Builds and publishes a MyMataSan release for a given tag: cross-compiled
# binaries + archives + .deb/.rpm + multi-arch Docker images (GoReleaser), with
# the matching CHANGELOG.md section as the GitHub Release notes.
#
# Invoked two ways:
#   - automatically by main.yml's version job (workflow_call) right after it
#     creates the vX.Y.Z tag on a version bump;
#   - manually via the Actions tab (workflow_dispatch) with a tag input.
#
# The committed apps/mymatasan/static bundle at the tag IS the release web UI, so
# there's no frontend rebuild here (which would also dirty the tree and fail
# GoReleaser's clean-state check).
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release (e.g. v1.74.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.74.0)
        required: true
        type: string

# Never let two releases run at once — concurrent pushes to the shared Docker
# `:latest-*` tags corrupt the multi-arch manifest ("manifest verification failed").
# Also guards a manual re-run from colliding with an in-flight auto release. Queue,
# don't cancel, so a second release still publishes after the first finishes.
concurrency:
  group: mymatasan-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          # The newest CHANGELOG entry (first "## " block) becomes the release body.
          # Written outside the repo so GoReleaser's clean-state check stays happy.
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "MyMataSan ${{ inputs.tag }}" > "$NOTES"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows x64 service installer (Inno Setup). Runs after the GitHub Release
  # exists (created by the goreleaser job) and uploads the .exe to it. Windows
  # arm64 users take the portable .zip from the goreleaser job.
  windows-installer:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Strip leading v from tag
        id: ver
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Embed brand icon + version into exe
        shell: bash
        run: bash packaging/gen-winres.sh "${{ steps.ver.outputs.version }}"

      - name: Build windows/amd64 binary
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist\windows-installer\mymatasan.exe .\cmd\mymatasan

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} `
            /DBinDir=${{ github.workspace }}\dist\windows-installer `
            packaging\windows\mymatasan.iss

      - name: Upload installer to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "packaging/windows/Output/mymatasan-setup-${{ steps.ver.outputs.version }}-windows-x64.exe" \
            --clobber
