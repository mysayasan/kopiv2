# Deploys the r450k marketing site to Cloudflare Workers when its source changes on
# main. The Download section reads the GitHub Releases API at the edge, so after this
# one-time-per-change deploy it self-updates as new mymatasan releases publish.
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN   - a Cloudflare token with the "Edit Cloudflare Workers"
#                            template permission (Workers Scripts: Edit).
# Optional:
#   CLOUDFLARE_ACCOUNT_ID  - only needed if the API token spans multiple accounts.
#
# Separately (once, not in CI) the Worker needs a GITHUB_TOKEN secret so it can read
# the PRIVATE repo's releases + proxy asset downloads:
#   cd r450k && npx wrangler secret put GITHUB_TOKEN
# (a fine-grained PAT with Contents: read on this repo, or a classic token with repo).
name: Deploy r450k

on:
  push:
    branches: [main]
    paths:
      - "r450k/**"
      - ".github/workflows/deploy-r450k.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 (pinned in r450k/package.json) requires Node >= 22.
          node-version: 22

      - name: Install & build
        working-directory: r450k
        run: |
          npm ci
          npm run build

      # Deploy with the wrangler pinned in r450k/package.json (wrangler@^4, already
      # installed by `npm ci` above). The cloudflare/wrangler-action installs its
      # own bundled wrangler (3.90.0), which predates wrangler.jsonc config support
      # and fails with "Missing entry-point" because it can't read `main` from the
      # JSONC config. Using the local wrangler@4 (--no-install) avoids that.
      - name: Deploy to Cloudflare
        working-directory: r450k
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
