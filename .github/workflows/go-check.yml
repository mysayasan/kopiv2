# Build, vet and test the Go tree on every PR and every push to a long-lived branch.
#
# Until this existed, NO workflow in the repo ran `go test`, `go vet` or a linter — the
# only Go command in CI was `go build` inside the four release workflows, which run on a
# tag rather than on a PR. So the ~60 Go test files in the tree were only ever run by hand,
# and a release could ship code that had not been compiled outside a developer's machine.
#
# That gap was not theoretical: TestApplySensitiveConfigRequiresOAuthSecretsWhenProviderConfigured
# had been asserting the OLD fail-closed behaviour for a half-configured OAuth provider long
# after the code deliberately changed to disable-with-a-warning, and nothing caught it.
#
# govulncheck is advisory (continue-on-error) so a freshly published advisory in a
# transitive dependency reports without blocking an unrelated PR. Promote it to blocking
# once the tree is known clean and someone owns triaging it.
name: Go check

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-check.yml'
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-check.yml'
  # The race detector runs on a schedule rather than per-PR. It is several times slower
  # than a plain test run, and a check that doubles PR latency gets worked around. Nightly
  # keeps the signal without taxing every push; workflow_dispatch is there so a branch
  # touching concurrent code can be raced on demand before it merges.
  schedule:
    - cron: '17 18 * * *' # 02:17 MYT — after the working day, before the next one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # Compiles every package including the four cmd/ entrypoints. CGO stays off to match
      # the release builds — the suite ships a single static binary per app and a cgo-only
      # dependency must fail here, not at release time.
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # The race detector. Until this existed, NOTHING in CI ever ran `-race`, in a tree that is
  # unusually concurrent: a recorder goroutine and a segment watcher per camera, four
  # independent monitor loops (camera health, machine health, vision, analytics), the
  # node-dialed control channel, the media-relay fan-out and the notification hub. That is
  # precisely the code where a data race survives review, hides for months, and then
  # corrupts a recording under load rather than failing a test.
  #
  # CGO_ENABLED is deliberately 1 here and only here: -race needs cgo, so this job cannot
  # match the release build's static-binary settings. build-vet-test above keeps CGO off and
  # remains the check that a cgo-only dependency can never sneak in.
  #
  # Not continue-on-error. A reported race is a real defect, and this job exists to be
  # believed — a nightly that is permanently orange teaches people to ignore it.
  race:
    name: race detector (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # -count=1 defeats the test cache: a cached PASS from the non-race job would
      # otherwise let packages skip instrumented execution entirely.
      # The timeout is per-test-binary and well above the default 10m, because the
      # instrumented build is slow enough that a package with real concurrency tests
      # (infra/recording, infra/control, domain/shared/fleetnode) can legitimately
      # take minutes.
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -count=1 -timeout 30m

  vulncheck:
    name: govulncheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Dependabot covers the npm frontends only, so the Go dependency tree has had no
      # automated advisory scanning at all — including the crypto-adjacent auth path
      # (gokrb5, go-ldap, go-oidc, golang-jwt, x/crypto).
      # Exits 0 deliberately. govulncheck returns 3 when it finds anything, and a check
      # that is red on every PR from day one trains people to ignore CI — which costs more
      # than the signal is worth while nobody owns triage. The findings are printed in full
      # here; promote this to a blocking check (drop the `|| true` and continue-on-error)
      # once the tree is clean and someone owns keeping it that way.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck reported findings — see the log above (advisory, not blocking)"
