    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Brand favicon: crisp SVG for modern browsers, .ico fallback (injected at
         the site root by HtmlWebpackPlugin) for older ones. -->

    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="MyPintuSan door access control" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="author" content="mysayasan" />
    <!-- Quicksand is self-hosted (assets/fonts.css) rather than loaded from
         Google Fonts: no cross-origin request, plus privacy + offline. -->
    <link rel="stylesheet" href="/assets/fonts.css" />
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
