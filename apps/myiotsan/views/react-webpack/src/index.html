<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Brand favicon: crisp SVG for modern browsers, .ico fallback (injected at
         the site root by HtmlWebpackPlugin) for older ones. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="MyIotSan — on-prem IoT sensor hub.">
    <meta name="theme-color" content="#0f1a14">
    <meta name="author" content="mysayasan">
    <!-- Quicksand is self-hosted (assets/fonts.css) rather than loaded from
         Google Fonts: the app runs air-gapped behind a strict CSP (default-src
         'self'), so no external asset may be referenced. -->
    <link rel="stylesheet" href="/assets/fonts.css">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
