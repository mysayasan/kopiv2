# nginx in front of MyIDSan — TLS terminated at the proxy, plain HTTP upstream.
#
# Pair this with `server.enableTLS: false` and `server.nonTlsPorts: [3001]` in
# config.json, and bind the app to loopback so nothing can reach it except nginx.
#
# Read deploy/reverse-proxy/README.md before adapting this. Two things about an
# identity provider make it stricter than an ordinary app behind a proxy:
#
#   1. The public URL is part of the protocol. Registered redirect URIs are matched
#      EXACTLY, so sso.example.com and sso.example.com:443 and a trailing slash are
#      three different values to a relying app.
#   2. X-Forwarded-* are claims, not facts. Anything the client sends under those
#      names must be erased here, or a caller can assert them to the app.

upstream myidsan {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Plain HTTP exists only to redirect. An IdP should never answer on it.
server {
    listen 80;
    listen [::]:80;
    server_name sso.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sso.example.com;

    ssl_certificate     /etc/ssl/certs/sso.example.com.crt;
    ssl_certificate_key /etc/ssl/private/sso.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS: an IdP is exactly the host you never want reached over cleartext.
    # Only enable includeSubDomains/preload once every subdomain is HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A sign-in page has no business being framed by another origin. The app also
    # sends X-Frame-Options: SAMEORIGIN; this is defence in depth at the edge.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # An authorization code or a session cookie must never be cached by an
    # intermediary. The app sets its own no-store headers; this covers the edge.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Sign-in posts are small. A large body limit on an auth endpoint is just a
    # cheap way to make the app do work. Raise it only if you use profile uploads.
    client_max_body_size 4m;

    location / {
        proxy_pass http://myidsan;
        proxy_http_version 1.1;

        # $host preserves the name the CLIENT used, which is what has to match the
        # registered redirect URIs. Do NOT use $proxy_host — that is the upstream's
        # name and would make the app build links pointing at 127.0.0.1.
        proxy_set_header Host              $host;

        # These three are assignments, not additions: whatever the client sent under
        # these names is discarded. That is the entire trust model — see the note on
        # X-Forwarded-Proto in deploy/reverse-proxy/README.md.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Kerberos SPNEGO only: the Negotiate handshake is per-CONNECTION, so it
        # breaks if the proxy multiplexes requests from different clients onto one
        # upstream connection. If you enable kerberos.enabled, uncomment these and
        # remove `keepalive 32` from the upstream block above.
        # proxy_set_header Connection "";
        # proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
