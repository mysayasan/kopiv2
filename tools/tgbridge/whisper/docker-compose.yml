# Local Whisper server (OpenAI-compatible /v1/audio/transcriptions) for tgbridge.
# DEFAULT = NVIDIA GPU build (best for large-v3). No GPU? use docker-compose.cpu.yml.
#
# Start:   docker compose up -d          (run from tools/tgbridge/whisper)
# Stop:    docker compose down
# Logs:    docker compose logs -f
#
# Requires: Docker Desktop + NVIDIA Container Toolkit (WSL2 GPU support).
#
# Point tgbridge at it (tools/tgbridge/config.json):
#   "stt_api_url": "http://127.0.0.1:8000/v1/audio/transcriptions",
#   "stt_model":   "Systran/faster-whisper-large-v3",
#   "stt_api_key": ""

services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper-server
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  whisper-models:
