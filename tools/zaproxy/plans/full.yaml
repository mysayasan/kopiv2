# OWASP ZAP Automation Framework plan — FULL ACTIVE scan (whole app).
#
# DANGER: spiders the entire app (UI + API) and runs ACTIVE attack rules
# against everything in scope except the destructive routes excluded below.
# Active scanning SENDS ATTACK PAYLOADS and WILL create/modify/delete data,
# fire notifications, and stress the box. NEVER run this against production.
# Use a THROWAWAY instance (see ../README.md).
env:
  contexts:
    - name: mymatasan
      urls:
        - ${TARGET}
      includePaths:
        - "${TARGET}.*"
      excludePaths:
        - ".*/api/system/.*"        # factory reset / restart / update / restore
        - ".*/purge.*"
        - ".*/factory-default.*"
        - ".*/segments/.*"
        - ".*/auth/change-password.*"
        - ".*/auth/session.*"
        - ".*/logout.*"
        - ".*/rules/[0-9].*"
        - ".*/users/[0-9].*"
        - ".*/classes/[0-9].*"
        - ".*/datasets/[0-9].*"
        - ".*/images/[0-9].*"
        - ".*/models/[0-9].*"
        - ".*/skills/[0-9].*"
        - ".*/restore.*"
        - ".*/backup.*"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: replacer
    rules:
      - description: basic-auth
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: ${ZAP_AUTH_HEADER}
        tokenProcessing: false

  - type: spider
    parameters:
      context: mymatasan
      url: ${TARGET}
      maxDuration: 8

  # The traditional spider can't execute JS, so it never sees the API calls a
  # SPA makes at runtime. The AJAX spider drives a real (headless) browser —
  # proxied through ZAP, so the replacer's Basic auth header logs it in — clicks
  # through the authenticated UI, and captures the /api/* requests the app fires.
  # Those requests are what activeScan then attacks. Without this, a SPA scan
  # only ever reaches the login shell + static assets.
  - type: spiderAjax
    parameters:
      context: mymatasan
      url: ${TARGET}
      maxDuration: 8
      browserId: firefox-headless
      numberOfBrowsers: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 15

  - type: activeScan
    parameters:
      context: mymatasan
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 60
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: full-${STAMP}
      reportTitle: mymatasan ZAP full active scan
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: full-${STAMP}
