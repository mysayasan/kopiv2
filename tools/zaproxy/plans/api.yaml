# OWASP ZAP Automation Framework plan — API ACTIVE scan (scoped to /api).
#
# What it does: spiders, then runs ACTIVE attack rules (injection, XSS, path
# traversal, etc.) against the /api surface ONLY, with every destructive route
# excluded. Active scanning SENDS ATTACK PAYLOADS and can create/modify/delete
# data. Run this against a THROWAWAY instance, not production.
# (See ../README.md → "Throwaway instance" and the mymatasan-verify-recipe.)
env:
  contexts:
    - name: mymatasan
      urls:
        - ${TARGET}/api
      includePaths:
        - "${TARGET}/api.*"
      excludePaths:
        - ".*/api/system/.*"        # factory reset / restart / update / restore
        - ".*/purge.*"
        - ".*/factory-default.*"
        - ".*/segments/.*"          # DELETE segment (footage loss)
        - ".*/auth/change-password.*"
        - ".*/auth/session.*"       # avoid tripping the login lockout
        - ".*/logout.*"
        - ".*/rules/[0-9].*"        # DELETE rule
        - ".*/users/[0-9].*"        # DELETE / password-reset user
        - ".*/classes/[0-9].*"
        - ".*/datasets/[0-9].*"
        - ".*/images/[0-9].*"
        - ".*/models/[0-9].*"
        - ".*/skills/[0-9].*"
        - ".*/restore.*"
        - ".*/backup.*"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: replacer
    rules:
      - description: basic-auth
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: ${ZAP_AUTH_HEADER}
        tokenProcessing: false

  - type: spider
    parameters:
      context: mymatasan
      url: ${TARGET}/api
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: activeScan
    parameters:
      context: mymatasan
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 30
      # Skip the DoS-flavoured / destructive attack strengths; we only want
      # to find real vulns, not knock the box over.
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules: []

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: api-${STAMP}
      reportTitle: mymatasan ZAP API active scan
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: api-${STAMP}
