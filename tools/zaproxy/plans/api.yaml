# OWASP ZAP Automation Framework plan — API ACTIVE scan (scoped to /api).
#
# What it does: spiders, then runs ACTIVE attack rules (injection, XSS, path
# traversal, etc.) against the /api surface ONLY, with every destructive route
# excluded. Active scanning SENDS ATTACK PAYLOADS and can create/modify/delete
# data. Run this against a THROWAWAY instance, not production.
# (See ../README.md → "Throwaway instance" and the mymatasan-verify-recipe.)
env:
  contexts:
    - name: mymatasan
      urls:
        - ${TARGET}/api
      includePaths:
        - "${TARGET}/api.*"
      excludePaths:
        - ".*/api/system/.*"        # factory reset / restart / update / restore
        - ".*/purge.*"
        - ".*/factory-default.*"
        - ".*/segments/.*"          # DELETE segment (footage loss)
        - ".*/auth/change-password.*"
        - ".*/auth/session.*"       # avoid tripping the login lockout
        - ".*/logout.*"
        - ".*/rules/[0-9].*"        # DELETE rule
        - ".*/users/[0-9].*"        # DELETE / password-reset user
        - ".*/classes/[0-9].*"
        - ".*/datasets/[0-9].*"
        - ".*/images/[0-9].*"
        - ".*/models/[0-9].*"
        - ".*/skills/[0-9].*"
        - ".*/restore.*"
        - ".*/backup.*"
        # Reachable only since the OpenAPI import below started seeding the full
        # documented surface; the spider never found them, so they were never
        # excluded before. Each one destroys footage or reconfigures hardware.
        - ".*/cameras/[0-9].*"                    # DELETE camera (and its recordings)
        - ".*/onvif-users/.*"                     # DELETE a user ON the physical camera
        - ".*/faces/[0-9].*"                      # DELETE face identity
        - ".*/faces/embeddings/.*"                # DELETE face embedding
        - ".*/notification/destination/[0-9].*"   # DELETE notification destination
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: replacer
    rules:
      - description: basic-auth
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: ${ZAP_AUTH_HEADER}
        tokenProcessing: false

  # Auth preflight. Without this an auth misconfiguration is INVISIBLE: ZAP
  # happily scans the public surface, finds nothing, and reports "plan
  # succeeded" — which reads as "the app is clean" when it actually means
  # "we never got past the login wall". /api/cameras requires a session, so a
  # non-200 here means the replacer above did not take effect. Fail loudly.
  - type: requestor
    requests:
      - url: ${TARGET}/api/cameras
        method: GET
        responseCode: 200

  # mymatasan's SPA calls /api/* from JavaScript that ZAP's traditional spider
  # cannot see, so on its own the spider finds ~6 URLs and activeScan attacks
  # almost nothing. Import the OpenAPI spec so activeScan sees the REAL endpoint
  # surface (213 documented operations), authenticated by the replacer above.
  # This is where the active coverage actually comes from — same reasoning as
  # myseliasan-api.yaml. Unlike myseliasan's, mymatasan's spec is valid OpenAPI
  # (no Gorilla-mux `{id:[0-9]+}` params), so failOnError can stay true.
  - type: openapi
    parameters:
      apiUrl: ${TARGET}/swagger/openapi.json
      targetUrl: ${TARGET}
      context: mymatasan

  - type: spider
    parameters:
      context: mymatasan
      url: ${TARGET}/api
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: activeScan
    parameters:
      context: mymatasan
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 30
      # Skip the DoS-flavoured / destructive attack strengths; we only want
      # to find real vulns, not knock the box over.
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules: []

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: api-${STAMP}
      reportTitle: mymatasan ZAP API active scan
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: api-${STAMP}
