# GoReleaser config for the MyMataSan NVR (github.com/mysayasan/kopiv2, app=mymatasan).
#
# Produces, from one `goreleaser release`:
#   - cross-compiled binaries: linux/windows/darwin x amd64/arm64 (pure Go, CGO off)
#   - .tar.gz (linux/macOS) / .zip (windows) archives bundling the web UI, AI worker
#     scripts, a default config, and the service unit files
#   - .deb / .rpm packages that install to /opt/mymatasan with a systemd unit
#   - multi-arch Docker images (see the `dockers` / `docker_manifests` blocks)
#
# Local dry run (no publish):  goreleaser release --snapshot --clean --skip=docker
# The web bundle (apps/mymatasan/static) must be built first (`make web APP=mymatasan`);
# CI does this before invoking goreleaser.
version: 2

project_name: mymatasan

before:
  hooks:
    - go mod download
    # Assemble the archive payload (web UI, AI scripts, default config, service
    # files) under packaging/staging/ with the exact home-dir layout.
    - bash packaging/stage-archive.sh

builds:
  - id: mymatasan
    main: ./cmd/mymatasan
    binary: mymatasan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mymatasan
    ids:
      - mymatasan
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Payload assembled by packaging/stage-archive.sh (before-hook). Each concrete
    # dir src is copied recursively under its dst, landing at the archive root as
    # static/, ai/, deploy/, config.json (alongside the binary).
    files:
      - src: packaging/staging/static
        dst: static
      - src: packaging/staging/ai
        dst: ai
      - src: packaging/staging/deploy
        dst: deploy
      - src: packaging/staging/config.json
        dst: config.json

nfpms:
  - id: mymatasan
    package_name: mymatasan
    ids:
      - mymatasan
    vendor: mysayasan
    homepage: https://github.com/mysayasan/kopiv2
    maintainer: mysayasan <mysayasan@gmail.com>
    description: MyMataSan NVR / camera monitor with on-device AI detection.
    license: PolyForm-Noncommercial-1.0.0
    formats:
      - deb
      - rpm
    # Everything installs under /opt/mymatasan (flat home == data layout matching
    # the shipped systemd unit). The binary goes to /opt/mymatasan/mymatasan.
    bindir: /opt/mymatasan
    contents:
      - src: apps/mymatasan/static
        dst: /opt/mymatasan/static
      - src: apps/mymatasan/ai/yolo_worker.py
        dst: /opt/mymatasan/ai/yolo_worker.py
      - src: apps/mymatasan/ai/train_worker.py
        dst: /opt/mymatasan/ai/train_worker.py
      - src: apps/mymatasan/ai/requirements-yolo.txt
        dst: /opt/mymatasan/ai/requirements-yolo.txt
      - src: apps/mymatasan/ai/requirements-lpr.txt
        dst: /opt/mymatasan/ai/requirements-lpr.txt
      - src: apps/mymatasan/ai/setup.sh
        dst: /opt/mymatasan/ai/setup.sh
      - src: apps/mymatasan/ai/yolo11n.pt
        dst: /opt/mymatasan/ai/yolo11n.pt
      - src: deploy/dist/config.json
        dst: /opt/mymatasan/config.json
        type: "config|noreplace"
      - src: deploy/nfpm/mymatasan.service
        dst: /etc/systemd/system/mymatasan.service
    scripts:
      postinstall: deploy/nfpm/postinstall.sh
      preremove: deploy/nfpm/preremove.sh
      postremove: deploy/nfpm/postremove.sh
    dependencies:
      - ffmpeg
    overrides:
      rpm:
        dependencies:
          - ffmpeg

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "\\[skip version\\]"

dockers:
  - id: mymatasan-amd64
    goos: linux
    goarch: amd64
    dockerfile: deploy/Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/mysayasan/mymatasan:{{ .Version }}-amd64"
      - "ghcr.io/mysayasan/mymatasan:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mysayasan/kopiv2"
    extra_files:
      - apps/mymatasan/static
      - apps/mymatasan/ai
      - deploy/dist/config.json
  - id: mymatasan-arm64
    goos: linux
    goarch: arm64
    dockerfile: deploy/Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/mysayasan/mymatasan:{{ .Version }}-arm64"
      - "ghcr.io/mysayasan/mymatasan:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mysayasan/kopiv2"
    extra_files:
      - apps/mymatasan/static
      - apps/mymatasan/ai
      - deploy/dist/config.json

docker_manifests:
  - name_template: "ghcr.io/mysayasan/mymatasan:{{ .Version }}"
    image_templates:
      - "ghcr.io/mysayasan/mymatasan:{{ .Version }}-amd64"
      - "ghcr.io/mysayasan/mymatasan:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mysayasan/mymatasan:latest"
    image_templates:
      - "ghcr.io/mysayasan/mymatasan:latest-amd64"
      - "ghcr.io/mysayasan/mymatasan:latest-arm64"
