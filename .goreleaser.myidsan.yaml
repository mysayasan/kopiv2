# GoReleaser config for MyIDSan — the identity provider / SSO hub
# (github.com/mysayasan/kopiv2, app=myidsan). The mymatasan node has its own config at
# .goreleaser.yaml; myseliasan/myiotsan follow this same per-app pattern.
#
# Produces, from one `goreleaser release`:
#   - cross-compiled binaries: linux/windows/darwin x amd64/arm64 (pure Go, CGO off)
#   - .tar.gz (linux/macOS) / .zip (windows) archives bundling the web UI, a default
#     config, and the service unit files
#   - .deb / .rpm packages that install to /opt/myidsan with a systemd unit
#   - multi-arch Docker images (see the `dockers` / `docker_manifests` blocks)
#
# ── Same two deliberate deviations as myseliasan's config ──────────────────────────
#
# 1. `release: disable: true`. myidsan is released under its OWN tag namespace,
#    `myidsan-v<ver>`, so its releases never collide with mymatasan's `v<ver>` tags
#    and never become the repo's "latest" release (which mymatasan's in-app updater
#    reads). GoReleaser OSS cannot derive a clean semver from a prefixed tag — the
#    monorepo/tag_prefix feature is Pro-only — so the workflow instead exports
#    GORELEASER_CURRENT_TAG=v<ver> to give GoReleaser a plain version, and publishes the
#    GitHub Release itself with `gh release create myidsan-v<ver> --latest=false`.
#    That is also why CI passes --skip=validate: the checked-out git tag intentionally
#    does not match GORELEASER_CURRENT_TAG.
#
# 2. No ffmpeg/Python/model payload. myidsan is pure Go — no nfpm `dependencies:`.
#
# Local dry run (no publish):
#   GORELEASER_CURRENT_TAG=v1.13.0 goreleaser release -f .goreleaser.myidsan.yaml \
#     --clean --skip=validate,publish,docker
#
# The web bundle (apps/myidsan/static) must be built first and committed; CI does not
# rebuild it (that would dirty the tree).
version: 2

project_name: myidsan

before:
  hooks:
    - go mod download
    # Embed the brand icon + version metadata into the Windows exe. Emits
    # cmd/myidsan/*_windows_<arch>.syso (gitignored, so the tree stays clean); Go
    # links the matching one per Windows target.
    - bash packaging/gen-winres.sh {{ .Version }} myidsan
    # Assemble the archive payload (web UI, default config, service files) under
    # packaging/staging-myidsan/ with the exact home-dir layout.
    - bash packaging/stage-archive-myidsan.sh

builds:
  - id: myidsan
    main: ./cmd/myidsan
    binary: myidsan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: myidsan
    ids:
      - myidsan
    # The `myidsan_` prefix is load-bearing, not cosmetic: mymatasan's in-app updater
    # matches release assets by name, so the product prefix is what keeps the
    # products' archives distinguishable.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Payload assembled by packaging/stage-archive-myidsan.sh (before-hook). Each
    # concrete dir src is copied recursively under its dst, landing at the archive root
    # as static/, deploy/, config.json (alongside the binary).
    files:
      - src: packaging/staging-myidsan/static
        dst: static
      - src: packaging/staging-myidsan/deploy
        dst: deploy
      - src: packaging/staging-myidsan/config.json
        dst: config.json

nfpms:
  - id: myidsan
    package_name: myidsan
    ids:
      - myidsan
    vendor: mysayasan
    homepage: https://github.com/mysayasan/kopiv2
    maintainer: mysayasan <mysayasan@gmail.com>
    description: MyIDSan — identity provider / SSO hub for the kopiv2 suite.
    license: PolyForm-Noncommercial-1.0.0
    formats:
      - deb
      - rpm
    # Everything installs under /opt/myidsan (flat home == data layout matching the
    # shipped systemd unit). The binary goes to /opt/myidsan/myidsan.
    bindir: /opt/myidsan
    contents:
      - src: apps/myidsan/static
        dst: /opt/myidsan/static
      - src: deploy/dist/myidsan-config.json
        dst: /opt/myidsan/config.json
        type: "config|noreplace"
      - src: deploy/nfpm/myidsan.service
        dst: /etc/systemd/system/myidsan.service
      # One-command uninstaller. `apt-get remove` keeps /opt/myidsan (it holds every suite
      # user and registered SSO client), so this is the front door for the other outcome:
      # `myidsan-uninstall --purge-data` erases it. Shared script, named per package — it
      # resolves the product from argv[0].
      - src: deploy/nfpm/uninstall.sh
        dst: /usr/sbin/myidsan-uninstall
        file_info:
          mode: 0755
    scripts:
      postinstall: deploy/nfpm/myidsan-postinstall.sh
      preremove: deploy/nfpm/myidsan-preremove.sh
      postremove: deploy/nfpm/myidsan-postremove.sh
    # No `dependencies:` — pure Go, nothing to pull in.

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# The GitHub Release is created by the workflow (gh release create) under the
# myidsan-v<ver> tag with --latest=false, NOT by GoReleaser. See the header.
release:
  disable: true

dockers:
  - id: myidsan-amd64
    goos: linux
    goarch: amd64
    dockerfile: deploy/Dockerfile.myidsan.release
    use: buildx
    image_templates:
      - "ghcr.io/mysayasan/myidsan:{{ .Version }}-amd64"
      - "ghcr.io/mysayasan/myidsan:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      # Buildx attaches provenance/SBOM attestations by default, which turns each
      # single-arch push into an OCI image index (image + unknown/unknown attestation).
      # `docker manifest create` for the combined :latest tag then can't verify those
      # child digests ("manifest verification failed"). Push plain image manifests so the
      # manifest list combines cleanly.
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mysayasan/kopiv2"
    extra_files:
      - apps/myidsan/static
      - deploy/dist/myidsan-config.json
  - id: myidsan-arm64
    goos: linux
    goarch: arm64
    dockerfile: deploy/Dockerfile.myidsan.release
    use: buildx
    image_templates:
      - "ghcr.io/mysayasan/myidsan:{{ .Version }}-arm64"
      - "ghcr.io/mysayasan/myidsan:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      # See the amd64 block: disable attestations so the pushed image is a plain manifest
      # the :latest manifest list can combine.
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mysayasan/kopiv2"
    extra_files:
      - apps/myidsan/static
      - deploy/dist/myidsan-config.json

docker_manifests:
  - name_template: "ghcr.io/mysayasan/myidsan:{{ .Version }}"
    image_templates:
      - "ghcr.io/mysayasan/myidsan:{{ .Version }}-amd64"
      - "ghcr.io/mysayasan/myidsan:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mysayasan/myidsan:latest"
    image_templates:
      - "ghcr.io/mysayasan/myidsan:latest-amd64"
      - "ghcr.io/mysayasan/myidsan:latest-arm64"
